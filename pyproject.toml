[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specdecode"
version = "0.1.0"
description = "Minimal tree speculative decoding for PyTorch causal language models"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers>=4.45"]

[project.optional-dependencies]
triton = ["triton>=3.0"]

[tool.setuptools.packages.find]
include = ["specdecode*"]
